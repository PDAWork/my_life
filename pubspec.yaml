name: my_life
description: Personal life application based on Friflex Flutter Starter.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  dio: ^5.9.0
  intl: ^0.20.2
  flutter_svg: ^2.2.2
  lottie: ^3.3.2
  talker_flutter: ^5.0.2
  talker_dio_logger: ^5.0.2
  talker_bloc_logger: ^5.0.2
  theme_tailor_annotation: ^3.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.3
  flutter_gen_runner: ^5.12.0
  theme_tailor: ^3.1.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/lottie/
flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true
